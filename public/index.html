<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Empire</title>
  <script src="/baremux/index.js"></script>
  <script src="/scram/scramjet.all.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    
    body {
      background: linear-gradient(rgba(15, 15, 20, 0.75), rgba(15, 15, 20, 0.85)),
                  url('/assets/bg.jpg') center/cover no-repeat fixed;
      background-color: #0f0f13;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #home {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 20px;
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .brand img { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; }
    .brand h1 { font-size: 2.5rem; letter-spacing: 1px; }

    #search-form {
      display: flex;
      width: 100%;
      max-width: 580px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 6px 8px 6px 20px;
    }
    #url-input {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 1rem;
      outline: none;
    }
    #search-form button {
      background: #5865f2;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
    }

    .shortcuts {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      width: 95px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }
    .card:hover { transform: translateY(-4px); background: rgba(255, 255, 255, 0.14); }
    .card img { width: 38px; height: 38px; border-radius: 8px; object-fit: contain; }
    .card span { font-size: 0.85rem; color: #ddd; }

    .cloak-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ccc;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .cloak-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

    #browser-view { display: none; flex-direction: column; height: 100vh; }
    #top-nav { display: flex; padding: 8px 12px; background: #16161d; gap: 10px; align-items: center; }
    #top-nav button { background: #262630; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    #frame-container { flex: 1; display: flex; width: 100%; background: white; }
  </style>
</head>
<body>

  <!-- HOME SCREEN -->
  <div id="home">
    <div class="brand">
      <img src="/assets/logo.png" alt="" onerror="this.style.display='none'" />
      <h1>The Empire</h1>
    </div>

    <form id="search-form">
      <input id="url-input" type="text" placeholder="Search DuckDuckGo or type a URL..." autocomplete="off" />
      <button type="submit">Search</button>
    </form>

    <div class="shortcuts">
      <div class="card" onclick="launchUrl('https://youtube.com')">
        <img src="https://google.com" alt="YouTube" />
        <span>YouTube</span>
      </div>
      <div class="card" onclick="launchUrl('https://discord.com')">
        <img src="https://google.com" alt="Discord" />
        <span>Discord</span>
      </div>
      <div class="card" onclick="launchUrl('https://github.io')">
        <img src="https://google.com" alt="Games" />
        <span>Games</span>
      </div>
    </div>

    <button class="cloak-btn" onclick="openCloaked()">Open in about:blank</button>
  </div>

  <!-- ACTIVE PROXY FRAME -->
  <div id="browser-view">
    <div id="top-nav">
      <button onclick="goHome()">Home</button>
      <button onclick="if(scramjetFrame) scramjetFrame.reload()">Reload</button>
    </div>
    <div id="frame-container"></div>
  </div>

  <script>
     const { ScramjetController } = $scramjetLoadController();
    const scramjet = new ScramjetController({
      files: {
        wasm: "/scram/scramjet.wasm.wasm",
        all: "/scram/scramjet.all.js",
        sync: "/scram/scramjet.sync.js",
      },
    });

    let scramjetFrame = null;

    const proxyReady = (async () => {
      await navigator.serviceWorker.register("/sw.js", { scope: "/" });
      await navigator.serviceWorker.ready;
      await scramjet.init();

      const connection = new BareMux.BareMuxConnection("/baremux/worker.js");
      const wispUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/wisp/";
      await connection.setTransport("/epoxy/index.mjs", [{ wisp: wispUrl }]);

      scramjetFrame = scramjet.createFrame();
      scramjetFrame.frame.style.cssText = "flex: 1; border: none; width: 100%; height: 100%;";
      document.getElementById("frame-container").appendChild(scramjetFrame.frame);
    })();

    async function launchUrl(input) {
      let url = input.trim();
      if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = url.includes(".") && !url.includes(" ")
          ? "https://" + url
          : "https://duckduckgo.com" + encodeURIComponent(url);
      }

      await proxyReady;

      document.getElementById("home").style.display = "none";
      document.getElementById("browser-view").style.display = "flex";
      scramjetFrame.go(url);
    }

    function goHome() {
      if (scramjetFrame) scramjetFrame.go("about:blank");
      document.getElementById("browser-view").style.display = "none";
      document.getElementById("home").style.display = "flex";
    }

    function openCloaked() {
      const win = window.open("about:blank", "_blank");
      const iframe = win.document.createElement("iframe");
      iframe.style = "position:fixed;inset:0;width:100%;height:100%;border:none;";
      iframe.src = location.href;
      win.document.body.appendChild(iframe);
    }

    document.getElementById("search-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const val = document.getElementById("url-input").value;
      if (val) launchUrl(val);
    });
  </script>
</body>
</html>
